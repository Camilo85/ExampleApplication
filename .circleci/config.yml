version: 2.1

workflow:
  version: 2
  build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
    
jobs:
  build:
    working_directory: ~/ExampleApplication
    docker:
      - image: circleci/node:20.11
        steps:
          - checkout
          - run:
              name: update-npm
              command: npm install
          - restore_cache:
              key: dependency-cache-{{ checksum "package-lock.json" }}
          - run:
              name: install-npm
              command: npm install
          - save_cache:
              key: dependency-cache-{{ checksum "package-lock.json" }}
              paths:
                - ./node_modules